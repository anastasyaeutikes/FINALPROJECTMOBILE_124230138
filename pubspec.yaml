name: beautyapp
description: A new Flutter project for a beauty routine app.
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Icons
  cupertino_icons: ^1.0.2
  
  # Location Services
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  
  # Permissions
  permission_handler: ^11.0.1
  
  # Network & API
  http: ^1.1.2
  url_launcher: ^6.2.1
  
  # Local Storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.1
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  
  # Security
  crypto: ^3.0.3
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  
  # Media
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true